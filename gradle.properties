# Options Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Version du serveur Hytale ciblée (artefact com.hypixel.hytale:Server sur maven.hytale.com)
hytale_version=0.7.2
# Plage de versions serveur écrite dans les manifest.json
hytale_server_range=>=0.7.2 <0.8.0

# Identité des mods
mod_group=Nakasar
mod_author=Nakasar
mod_version=0.1.0

# Répertoire "mods/" d'un serveur Hytale local, pour la tâche `deployToServer`.
# À surcharger dans gradle-local.properties (non versionné) ou en ligne de commande :
#   ./gradlew deployToServer -Phytale.modsDir=/chemin/vers/Server/mods
hytale.modsDir=
