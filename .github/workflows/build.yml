name: build

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (compile, validateJson, jar, zip, pack)
        run: ./gradlew build packMods --no-daemon
      # L'artefact téléchargé depuis GitHub est un zip contenant directement les jars et zips des mods :
      # il s'extrait tel quel dans le dossier mods/ d'une save.
      - uses: actions/upload-artifact@v4
        with:
          name: Nakasar-Mods-Pack
          path: build/mods-pack/
          if-no-files-found: error
