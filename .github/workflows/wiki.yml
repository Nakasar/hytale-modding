name: wiki

# Construit le wiki joueur (site Docusaurus dans wiki/, pages Markdown dans docs/wiki) à chaque PR qui le
# touche, et le publie sur GitHub Pages à chaque push sur main. Prérequis : Settings > Pages > Source =
# « GitHub Actions ».
on:
  push:
    branches: ["main"]
    paths: ["wiki/**", "docs/wiki/**", "mods/nakasar-vampires/src/main/resources/Common/**",
            "mods/nakasar-fractals/src/main/resources/Common/**",
            ".github/workflows/wiki.yml"]
  pull_request:
    paths: ["wiki/**", "docs/wiki/**", "mods/nakasar-vampires/src/main/resources/Common/**",
            "mods/nakasar-fractals/src/main/resources/Common/**",
            ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - run: npm ci
      # Liens et ancres cassés font échouer la construction (onBrokenLinks/onBrokenAnchors: "throw").
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: wiki/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
